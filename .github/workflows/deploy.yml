name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Authenticate with Azure Artifacts
        run: |
          echo "//pkgs.dev.azure.com/NationsBenefits2/_packaging/NationsBenefits/npm/registry/:username=NationsBenefits2" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/NationsBenefits2/_packaging/NationsBenefits/npm/registry/:_password=$(echo -n '${{ secrets.AZURE_ARTIFACTS_TOKEN }}')" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/NationsBenefits2/_packaging/NationsBenefits/npm/registry/:email=$(echo -n '${{ secrets.AZURE_ARTIFACTS_USER }}')" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/NationsBenefits2/_packaging/NationsBenefits/npm/:username=NationsBenefits2" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/NationsBenefits2/_packaging/NationsBenefits/npm/:_password=$(echo -n '${{ secrets.AZURE_ARTIFACTS_TOKEN }}')" >> ~/.npmrc
          echo "//pkgs.dev.azure.com/NationsBenefits2/_packaging/NationsBenefits/npm/:email=$(echo -n '${{ secrets.AZURE_ARTIFACTS_USER }}')" >> ~/.npmrc

      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npx vite build
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist